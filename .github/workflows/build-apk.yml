# Spo~z — build an optimized, signed RELEASE APK on every push.
#
# Release, not debug: the debug variant ships with no R8/minification, no
# resource shrinking and `debuggable` on, which is dramatically heavier on
# device. The release variant enables minify + shrinkResources and is what
# makes the app feel light on low-end phones.
#
# Note: app/build.gradle.kts gives the release type no signingConfig, so AGP
# emits an unsigned APK; we sign it here with apksigner. No secrets needed.

name: Build Spo~z APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: spoz-release
      KEY_ALIAS: spoz
      KEY_PASSWORD: spoz-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          mkdir -p app/keystore
          rm -f app/keystore/release.keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Spoz,O=Spoz,C=IN"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew --console=plain assembleFossRelease -x lint
        env:
          GLOSSY_APP_NAME: "Spo~z"
          GLOSSY_APPLICATION_ID: com.spoz.music

      - name: Sign release APK
        run: |
          OUT=app/build/outputs/apk/foss/release
          UNSIGNED=$(find "$OUT" -name "*-unsigned.apk" | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT/spoz-aligned.apk"
          "$BT/apksigner" sign \
            --ks app/keystore/release.keystore \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT/spoz-release.apk" \
            "$OUT/spoz-aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spoz-release-apk
          path: app/build/outputs/apk/foss/release/spoz-release.apk
          if-no-files-found: error
