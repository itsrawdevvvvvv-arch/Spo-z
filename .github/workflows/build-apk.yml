# Spo~z — build a signed RELEASE APK on every push.
#
# The signing key is FIXED (committed at app/keystore/release.keystore) so every
# build carries the SAME signature. That is what lets a new APK install over an
# older one as a normal update, instead of failing with a package/signature
# conflict. The keystore must never be replaced, or installed users would have
# to uninstall before they could update again.

name: Build Spo~z APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: spozpass
      KEY_ALIAS: spoz
      KEY_PASSWORD: spozpass

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew --console=plain assembleFossRelease -x lint
        env:
          GLOSSY_APP_NAME: "Spo~z"
          GLOSSY_APPLICATION_ID: com.spoz.music

      - name: Sign release APK
        run: |
          OUT=app/build/outputs/apk/foss/release
          UNSIGNED=$(find "$OUT" -name "*-unsigned.apk" | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT/spoz-aligned.apk"
          "$BT/apksigner" sign \
            --ks app/keystore/release.keystore \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT/spoz-release.apk" \
            "$OUT/spoz-aligned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spoz-release-apk
          path: app/build/outputs/apk/foss/release/spoz-release.apk
          if-no-files-found: error
