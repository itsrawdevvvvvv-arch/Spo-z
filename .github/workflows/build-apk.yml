# Spo~z — build an installable APK on every push.
#
# Every push produces a fresh debug APK you can download from the run's
# "Artifacts" section — no signing secrets required, because the debug
# variant is signed with the throwaway debug keystore.

name: Build Spo~z APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --console=plain assembleFossDebug -x lint
        env:
          GLOSSY_APP_NAME: "Spo~z"
          GLOSSY_APPLICATION_ID: com.spoz.music

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spoz-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
