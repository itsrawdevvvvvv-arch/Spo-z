# Spo~z — build an installable APK on every push.
#
# Every push produces a fresh debug APK you can download from the run's
# "Artifacts" section. No signing secrets are needed: we generate the standard
# Android debug keystore locally, which is what the app's debug signing config
# expects (see app/build.gradle.kts -> signingConfigs.debug).

name: Build Spo~z APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --console=plain assembleFossDebug -x lint
        env:
          GLOSSY_APP_NAME: "Spo~z"
          GLOSSY_APPLICATION_ID: com.spoz.music

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spoz-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
