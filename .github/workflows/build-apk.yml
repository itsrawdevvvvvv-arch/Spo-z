# Spo~z — build an optimized RELEASE APK on every push.
#
# Why release and not debug: the debug variant ships with no R8/minification,
# no resource shrinking and `debuggable` on, which is dramatically heavier on
# device. The release variant (see app/build.gradle.kts -> buildTypes.release)
# enables minify + shrinkResources and is what makes the app feel light on
# low-end phones. We sign it with a keystore generated here, so no secrets are
# needed.

name: Build Spo~z APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: spoz-release
      KEY_ALIAS: spoz
      KEY_PASSWORD: spoz-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          mkdir -p app/keystore
          # The repo ships its own release.keystore; replace it with ours so the
          # passwords below are the ones in effect.
          rm -f app/keystore/release.keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Spoz,O=Spoz,C=IN"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew --console=plain assembleFossRelease -x lint
        env:
          GLOSSY_APP_NAME: "Spo~z"
          GLOSSY_APPLICATION_ID: com.spoz.music

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spoz-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
